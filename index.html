<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<style>
:root{
  --bg:#ffffff;
  --panel:#f7f6f3;
  --text:#37352f;
  --text-2:#787774;
  --text-3:#9b9a97;
  --line:rgba(55,53,47,0.09);
  --line-2:rgba(55,53,47,0.16);
  --hover:rgba(55,53,47,0.06);
  --radius:6px;
  --px-hour:34;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 40px;}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.hdr-date{font-size:21px;font-weight:600;letter-spacing:-0.01em;}
.hdr-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
.navrow{display:flex;gap:6px;flex:none;}

button{
  font-family:inherit;font-size:13px;color:var(--text);
  background:transparent;border:1px solid var(--line-2);border-radius:var(--radius);
  padding:4px 10px;cursor:pointer;line-height:1.4;
}
button:hover{background:var(--hover);}
button:active{transform:scale(0.98);}
.btn-icon{padding:4px 8px;min-width:28px;}
.btn-sm{font-size:12px;padding:3px 8px;}

input[type=text],input[type=date],select{
  font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);
  border:1px solid var(--line-2);border-radius:var(--radius);padding:4px 7px;line-height:1.4;
}
input[type=text]:focus,input[type=date]:focus,select:focus{outline:none;border-color:#37352f;}

.rule{border-top:1px solid var(--line);margin:12px 0;}

.meals{background:var(--panel);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.meals-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;}
.slot{border-radius:var(--radius);padding:4px 6px;margin:-4px -6px;cursor:pointer;position:relative;}
.slot:hover{background:rgba(55,53,47,0.05);}
.slot.open{background:var(--bg);box-shadow:0 0 0 1px var(--line-2);}
.slot-label{font-size:11px;color:var(--text-3);}
.slot-val{font-size:13px;margin-top:1px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.slot-val .car{color:var(--text-3);font-size:10px;flex:none;}
.countdown{font-size:11px;color:var(--text-3);text-align:right;line-height:1.35;white-space:nowrap;flex:none;}

.picker{position:absolute;z-index:40;top:100%;left:0;margin-top:5px;min-width:230px;max-width:280px;
  background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px;
  box-shadow:0 8px 24px rgba(15,15,15,0.12),0 2px 6px rgba(15,15,15,0.08);}
.picker-h{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;padding:5px 7px 4px;}
.picker-i{font-size:13px;padding:6px 7px;border-radius:var(--radius);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.picker-i:hover{background:var(--hover);}
.picker-i .tick{color:var(--text-3);font-size:12px;}
.picker-sep{border-top:1px solid var(--line);margin:5px 3px;}
.picker-note{font-size:12px;color:var(--text-3);padding:2px 7px 6px;line-height:1.45;}
.picker-clear{color:var(--text-2);}
.picker-other{display:flex;gap:5px;padding:4px 7px 5px;align-items:center;}
.picker-other input[type=text]{flex:1;min-width:0;font-size:13px;}

.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,0.95fr);gap:22px;}
.colh{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);height:24px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}

.sched{position:relative;}
.rail{position:absolute;top:0;left:0;width:40px;height:100%;}
.rail-l{position:absolute;font-size:11px;color:var(--text-3);transform:translateY(-6px);}
.spine{position:absolute;top:0;width:1px;background:var(--line);}
.evarea{position:absolute;top:0;left:60px;right:0;}
.ev{position:absolute;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden;}
.ev-t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-h{font-size:11px;color:var(--text-3);white-space:nowrap;flex:none;}
.gapline{position:absolute;width:1px;background:var(--line-2);}
.gaplab{position:absolute;font-size:11px;color:var(--text-3);white-space:nowrap;}
.empty{font-size:13px;color:var(--text-3);padding:6px 0;}

.subh{font-size:11px;color:var(--text-2);margin:0 0 2px;}
.subh.spaced{margin-top:16px;}
.row{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.cb{width:15px;height:15px;flex:none;margin-top:2px;border:1px solid var(--line-2);border-radius:3px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--bg);}
.cb:hover{border-color:#37352f;}
.cb.on{background:#37352f;border-color:#37352f;}
.cb.on::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-1px,-1px);}
.row-t{font-size:13px;line-height:1.45;flex:1;min-width:0;word-break:break-word;}
.row.done .row-t{color:var(--text-3);text-decoration:line-through;}
.tag{font-size:11px;color:var(--text-3);flex:none;white-space:nowrap;padding-top:2px;}
.overdue{font-size:11px;color:var(--text-3);flex:none;white-space:nowrap;padding-top:2px;}

.addline{display:flex;align-items:center;gap:7px;padding:9px 0 0;font-size:12px;color:var(--text-3);cursor:pointer;}
.addline:hover{color:var(--text-2);}
.addform{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0;align-items:center;}
.addform input[type=text]{flex:1;min-width:120px;}

.nodate{border-top:1px solid var(--line-2);margin-top:16px;padding-top:10px;}
.mini-h{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px;}

.up{padding:6px 0;border-bottom:1px solid var(--line);}
.up:last-child{border-bottom:none;}
.up-d{font-size:11px;color:var(--text-3);}
.up-t{font-size:13px;line-height:1.4;margin-top:1px;}

.tmr{margin-top:18px;background:var(--panel);border-radius:var(--radius);padding:10px 12px;}
.tmr-r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
.tmr-n{font-size:12px;}
.tmr-h{font-size:11px;color:var(--text-3);white-space:nowrap;}

.allday{font-size:12px;color:var(--text-2);background:var(--panel);border-radius:var(--radius);padding:4px 8px;margin-bottom:6px;}
#splash{padding:28px 0;}
.err{max-width:520px;}
.err-h{font-size:15px;margin-bottom:4px;}
.err-b{font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.5;}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;max-width:520px;
  background:#37352f;color:#fff;font-size:13px;line-height:1.45;padding:9px 14px;border-radius:6px;
  box-shadow:0 6px 20px rgba(15,15,15,0.25);}
#toast[hidden]{display:none;}
#busy{font-size:11px;color:var(--text-3);opacity:0;transition:opacity .15s;align-self:center;}
.ovl{position:fixed;inset:0;background:rgba(15,15,15,0.4);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:36px 20px;overflow-y:auto;}
.ovl[hidden]{display:none;}
.modal{width:100%;max-width:720px;background:var(--bg);border-radius:8px;padding:16px 18px 16px;
  box-shadow:0 12px 40px rgba(15,15,15,0.2);}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-t{font-size:17px;font-weight:600;}
.day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.day.today{background:var(--panel);border-radius:var(--radius);}
.day-l{font-size:12px;color:var(--text-3);padding-top:3px;padding-left:6px;}
.day.today .day-l{color:var(--text);}
.day-b{padding-right:6px;}
.mrow{display:flex;align-items:flex-start;gap:9px;padding:2px 0;}
.mrow .row-t{font-size:13px;}
.mrow.done .row-t{color:var(--text-3);text-decoration:line-through;}
.mdate{font-size:12px;padding:2px 5px;flex:none;}
.mkind{font-size:12px;padding:2px 4px;flex:none;}

/* ---- 14-day meal plan ---- */
/* Slot colours are the only thing carrying meaning at a glance here, so they
   also get a written label — colour alone would be useless to anyone who can't
   separate the three hues. */
.mpwide{max-width:980px;}
.mpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.mpday{border:1px solid var(--line);border-radius:var(--radius);padding:8px 9px 7px;}
.mpday.today{border-color:#37352f;}
.mphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.mpdow{font-size:13px;font-weight:600;}
.mpnum{font-size:11px;color:var(--text-3);}
.mpslot{display:flex;gap:7px;align-items:flex-start;padding:5px 4px;margin:0 -4px;
  border-top:1px solid var(--line);cursor:pointer;position:relative;border-radius:4px;}
.mpslot:first-of-type{border-top:none;}
.mpslot:hover{background:var(--hover);}
.mpslot.open{background:var(--panel);}
.mpbar{width:3px;border-radius:2px;align-self:stretch;min-height:26px;flex:none;}
.mpslot.b .mpbar{background:#d9a441;}
.mpslot.l .mpbar{background:#d4703a;}
.mpslot.d .mpbar{background:#7d5fa8;}
.mptext{min-width:0;flex:1;}
.mpl{font-size:10px;color:var(--text-3);letter-spacing:.03em;display:block;line-height:1.3;}
.mpslot.b .mpl{color:#a87c26;}
.mpslot.l .mpl{color:#b05524;}
.mpslot.d .mpl{color:#634790;}
.mpv{font-size:12.5px;line-height:1.3;display:block;word-break:break-word;}
.mpv.none{color:var(--text-3);}
.mpfoot{font-size:11px;color:var(--text-3);margin-top:12px;line-height:1.5;}
@media(max-width:560px){
  .mpgrid{grid-template-columns:minmax(0,1fr);}
}

@media(max-width:900px){
  .wrap{padding:14px 14px 40px;}
  .cols{grid-template-columns:minmax(0,1fr);gap:26px;}
  .meals{flex-wrap:wrap;}
  .meals-grid{grid-template-columns:minmax(0,1fr);gap:6px;}
  .countdown{text-align:left;}
  .picker{max-width:none;right:0;}
  .day{grid-template-columns:minmax(0,1fr);gap:2px;}
  .day-l{padding-left:0;}
  .addform input[type=text]{min-width:100%;}
  .modal{padding:14px;}
}
</style>
</head>
<body>
<div class="wrap">

<div id="splash"></div>

<div id="stage" hidden>

  <div class="hdr">
    <div>
      <div class="hdr-date" id="hdrDate">—</div>
      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <div class="navrow">
      <span id="busy">saving…</span>
      <button id="openMP">Meal plan</button>
      <button class="btn-icon" id="prevDay" aria-label="Previous day">‹</button>
      <button id="todayBtn">Today</button>
      <button class="btn-icon" id="nextDay" aria-label="Next day">›</button>
    </div>
  </div>

  <div class="rule"></div>

  <div class="meals" id="meals"></div>

  <div class="cols">

    <div>
      <div class="colh"><span>Schedule</span></div>
      <div id="allday"></div>
      <div class="sched" id="sched"></div>
    </div>

    <div>
      <div class="colh">
        <span>To do</span>
        <button class="btn-sm" id="openTM">Task manager</button>
      </div>
      <div id="todo"></div>
    </div>

    <div>
      <div class="colh"><span>Coming up</span></div>
      <div id="upcoming"></div>
      <div class="tmr" id="tomorrow"></div>
    </div>

  </div>

</div>
</div>

<div id="toast" hidden></div>

<div class="ovl" id="mpOvl" hidden>
  <div class="modal mpwide" role="dialog" aria-label="Meal plan">
    <div class="modal-h">
      <div>
        <div class="modal-t">Meal plan</div>
        <div class="hdr-sub" id="mpSub"></div>
      </div>
      <div class="navrow">
        <button class="btn-icon" id="prevMP" aria-label="Previous 14 days">‹</button>
        <button class="btn-sm" id="mpToday">Today</button>
        <button class="btn-icon" id="nextMP" aria-label="Next 14 days">›</button>
        <button class="btn-icon" id="closeMP" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="rule"></div>
    <div id="mpBody"></div>
  </div>
</div>

<div class="ovl" id="tmOvl" hidden>
  <div class="modal" role="dialog" aria-label="Task manager">
    <div class="modal-h">
      <div>
        <div class="modal-t">Task manager</div>
        <div class="hdr-sub" id="tmSub"></div>
      </div>
      <div class="navrow">
        <button class="btn-icon" id="prevWk" aria-label="Previous week">‹</button>
        <button class="btn-icon" id="nextWk" aria-label="Next week">›</button>
        <button class="btn-icon" id="closeTM" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="rule"></div>
    <div id="tmBody"></div>
  </div>
</div>

<script>
/* ---------- date helpers ---------- */
const MS=86400000;
function pad(n){return String(n).padStart(2,"0");}
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return isoOf(d);}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/MS);}
function startOfWeek(s){const d=parse(s);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return isoOf(d);}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function longDate(s){const d=parse(s);return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate();}
function shortDate(s){const d=parse(s);return DOW[d.getDay()]+", "+MONS[d.getMonth()]+" "+d.getDate();}
function mins(t){const p=t.split(":");return +p[0]*60+ +p[1];}
function fmtShort(t){let[h,m]=t.split(":").map(Number);h=h%12;if(h===0)h=12;return h+":"+pad(m);}
function fmtHour(h){const ap=h>=12?"pm":"am";let x=h%12;if(x===0)x=12;return x+" "+ap;}
function dur(m){const h=Math.floor(m/60),r=m%60;if(h&&r)return h+" hr "+r+" min";if(h)return h+" hr";return r+" min";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* Notion hands back timestamps with an offset. Converting here, with the
   device's own clock, is what keeps a 9:30pm wind-down on tonight rather than
   tomorrow morning in UTC. Date-only values are left alone — parsing those
   through Date() would shift them backwards west of Greenwich. */
function localDate(iso){
  if(!iso)return null;
  if(iso.length<=10)return iso;
  const d=new Date(iso);
  return isNaN(d)?null:isoOf(d);
}
function localTime(iso){
  if(!iso||iso.length<=10)return null;
  const d=new Date(iso);
  return isNaN(d)?null:pad(d.getHours())+":"+pad(d.getMinutes());
}

/* ---------- meal slots ---------- */
/* The Meals & Recipes database tags every page with a Type. Only the three MP
   types belong in a meal slot; Side and anything else never appears in a
   picker. The prefix is stripped here so the dashboard works whether the
   server hands back "MP Lunch" or already-shortened "Lunch". A recipe with no
   Type, or a Type that isn't one of the three, is dropped rather than offered
   everywhere. */
const SLOTS=["Breakfast","Lunch","Dinner"];
function slotOf(type){
  if(!type)return null;
  const t=String(type).trim().replace(/^MP[\s\u00a0._-]*/i,"").toLowerCase();
  for(let i=0;i<SLOTS.length;i++){
    if(SLOTS[i].toLowerCase()===t)return SLOTS[i];
  }
  return null;
}

/* Meals you didn't cook. These save to the Meal Plan as a plain name with no
   recipe attached, so a dining-hall day still fills the slot. */
const EATING_OUT=["Dining hall","Restaurant"];

/* "Other" in the eating-out list. Holds {date,slot} while its text box is open,
   so only one box exists at a time and it survives a re-render of the picker
   it lives in. Whatever gets typed is saved as a plain name with no recipe
   attached, exactly like Dining hall — which means it contributes nothing to
   the calorie and protein rollups, same as the other two. */
let otherOpen=null;
function otherRow(date,slot){
  const on=otherOpen&&otherOpen.date===date&&otherOpen.slot===slot;
  if(!on){
    return '<div class="picker-i" data-oopen="1" data-oodate="'+date+
           '" data-ooslot="'+slot+'"><span>Other…</span></div>';
  }
  return '<div class="picker-other">'+
         '<input type="text" id="otherInput" placeholder="Where / what?" maxlength="80" />'+
         '<button class="btn-sm" data-oogo="1" data-oodate="'+date+
         '" data-ooslot="'+slot+'">Add</button></div>';
}

/* ---------- state ---------- */
let CAL=[],TASKS=[],MEALS=[],RECIPES=[];
let mealsEnabled=true;
let TODAY=isoOf(new Date());
let view=TODAY;
let wkStart=startOfWeek(TODAY);
let openSlot=null;
/* The 14-day plan overlay. mpStart is the first day shown; mpOpen is which
   slot on which day has its picker open, so two days can't both be open at
   once. Kept separate from openSlot, which belongs to the single-day strip. */
let mpStart=TODAY;
let mpOpen=null;
const MP_DAYS=14;
let addOpen={day:false,nodate:false};
let loaded=false,loadError=null,busy=0;
let _tmp=0;
const UNFINISHED_WINDOW=7;

/* ---------- talking to the server ---------- */
async function pull(){
  const r=await fetch("/api/notion",{headers:{Accept:"application/json"}});
  const j=await r.json().catch(()=>({message:"The server sent something unreadable."}));
  if(!r.ok)throw new Error(j.message||("Request failed ("+r.status+")"));
  return j;
}
async function push(payload){
  busy++;renderBusy();
  try{
    const r=await fetch("/api/notion",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const j=await r.json().catch(()=>({message:"The server sent something unreadable."}));
    if(!r.ok)throw new Error(j.message||("Save failed ("+r.status+")"));
    return j;
  }finally{busy--;renderBusy();}
}

function absorb(data){
  mealsEnabled=data.mealsEnabled!==false;
  CAL=(data.events||[]).map(e=>{
    const date=localDate(e.start);
    const start=localTime(e.start);
    let end=localTime(e.end);
    /* an event running past midnight is clamped so it doesn't overflow the rail */
    if(end&&e.end&&localDate(e.end)!==date)end="23:59";
    return {id:e.id,name:e.name,type:e.type,routine:!!e.routine,
            date,start,end,allDay:!start};
  }).filter(e=>e.date);
  TASKS=(data.tasks||[]).map(t=>({
    id:t.id,name:t.name,date:t.date?t.date.slice(0,10):null,
    kind:t.kind==="Errand"?"Errand":"Task",done:!!t.done
  }));
  MEALS=(data.meals||[]).map(m=>({
    id:m.id,name:m.name,date:m.date.slice(0,10),slot:m.slot,recipe:m.recipe||[]
  }));
  RECIPES=(data.recipes||[])
    .map(r=>({id:r.id,name:r.name,slot:slotOf(r.slot||r.type)}))
    .filter(r=>r.name&&r.slot);
  TODAY=isoOf(new Date());
}

async function load(){
  try{
    absorb(await pull());
    loaded=true;loadError=null;
    if(view===null)view=TODAY;
  }catch(e){
    loadError=e.message||"Couldn't reach Notion.";
  }
  render();
}

/* ---------- derived ---------- */
function eventsOn(d){
  return CAL.filter(e=>e.date===d&&!e.allDay).sort((a,b)=>mins(a.start)-mins(b.start));
}
function allDayOn(d){return CAL.filter(e=>e.date===d&&e.allDay);}
function endOf(e){return e.end?Math.max(mins(e.end),mins(e.start)+15):mins(e.start)+60;}

function mealsOn(d){const o={};MEALS.filter(m=>m.date===d).forEach(m=>{o[m.slot]=m;});return o;}
/* A cleared slot can leave a nameless row behind in Meal Plan, depending on how
   the server clears it. Those don't count as a planned day. */
function planEnd(){let last=null;MEALS.forEach(m=>{if(!m.name)return;if(!last||m.date>last)last=m.date;});return last;}
/* The recipes you can cook for this slot. An exact slot match only — no
   untagged recipes, no Sides, and no falling back to names already sitting in
   the plan, which is how non-MP meals used to creep back into the list. */
function optionsFor(slot){
  const out=[],seen={};
  RECIPES.forEach(r=>{
    if(r.slot!==slot)return;
    if(seen[r.name])return;
    seen[r.name]=1;out.push(r);
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}

function tasksOn(d,kind){return TASKS.filter(t=>t.date===d&&t.kind===kind);}
function undated(){return TASKS.filter(t=>!t.date);}
function unfinishedTasks(){
  return TASKS.filter(t=>t.kind==="Task"&&!t.done&&t.date&&t.date<TODAY&&diffDays(TODAY,t.date)<=UNFINISHED_WINDOW)
              .sort((a,b)=>a.date<b.date?-1:1);
}
function overdueErrands(){
  return TASKS.filter(t=>t.kind==="Errand"&&!t.done&&t.date&&t.date<TODAY)
              .sort((a,b)=>a.date<b.date?-1:1);
}

/* ---------- schedule ---------- */
function renderSchedule(){
  const box=document.getElementById("sched");
  const evs=eventsOn(view);
  const ad=allDayOn(view);
  const adBox=document.getElementById("allday");
  adBox.innerHTML=ad.map(e=>'<div class="allday">'+esc(e.name)+'</div>').join("");

  if(!evs.length){
    box.style.height="auto";
    box.innerHTML=ad.length?"":'<div class="empty">Nothing scheduled.</div>';
    return;
  }

  const PX=34;
  let first=Math.floor(mins(evs[0].start)/60);
  let lastM=0;evs.forEach(e=>{lastM=Math.max(lastM,endOf(e));});
  let last=Math.ceil(lastM/60);
  if(last-first<3)last=first+3;
  if(last>24)last=24;
  const span=last-first,H=span*PX;
  const top=m=>(m-first*60)/60*PX;

  const clusters=[];let cur=[],curEnd=-1;
  evs.forEach(e=>{
    if(cur.length&&mins(e.start)>=curEnd){clusters.push({items:cur,start:mins(cur[0].start),end:curEnd});cur=[];curEnd=-1;}
    cur.push(e);curEnd=Math.max(curEnd,endOf(e));
  });
  if(cur.length)clusters.push({items:cur,start:mins(cur[0].start),end:curEnd});

  let h='<div class="rail">';
  const step=span<=9?1:(span<=14?2:3);
  for(let hh=first;hh<=last;hh+=step)h+='<div class="rail-l" style="top:'+top(hh*60)+'px">'+fmtHour(hh)+'</div>';
  h+='</div><div class="spine" style="left:46px;height:'+H+'px"></div>';
  h+='<div class="evarea" style="height:'+H+'px">';

  clusters.forEach(function(cl,ci){
    const colEnd=[];
    cl.items.forEach(function(e){
      const s=mins(e.start);let c=0;
      while(c<colEnd.length&&colEnd[c]>s)c++;
      colEnd[c]=endOf(e);e._col=c;
    });
    const n=colEnd.length;
    cl.items.forEach(function(e){
      const s=mins(e.start),en=endOf(e),w=100/n;
      h+='<div class="ev" style="top:'+top(s)+'px;left:'+(e._col*w)+'%;width:calc('+w+'% - 4px);height:'+
         Math.max(30,(en-s)/60*PX)+'px">'+
         '<span class="ev-t">'+esc(e.name)+'</span><span class="ev-h">'+fmtShort(e.start)+'</span></div>';
    });
    const nx=clusters[ci+1];
    if(nx&&nx.start-cl.end>0){
      const g=nx.start-cl.end,gy=top(cl.end),gh=g/60*PX;
      h+='<div class="gaplab" style="top:'+(gy+gh/2-9)+'px;left:0">'+dur(g)+' open</div>';
    }
  });
  h+='</div>';

  clusters.forEach(function(cl,ci){
    const nx=clusters[ci+1];
    if(!nx)return;
    const g=nx.start-cl.end;
    if(g<=0)return;
    const gy=top(cl.end),gh=g/60*PX;
    h+='<div class="gapline" style="top:'+(gy+3)+'px;left:46px;height:'+Math.max(2,gh-6)+'px"></div>';
  });

  box.style.height=H+"px";
  box.innerHTML=h;
}

function taskRow(t,opts){

    const d=diffDays(TODAY,t.date);

  return '<div class="row'+(t.done?" done":"")+'">'+
    '<div class="cb'+(t.done?" on":"")+'" data-toggle="'+t.id+'" role="checkbox" aria-checked="'+t.done+'" tabindex="0"></div>'+
    '<div class="row-t">'+esc(t.name)+'</div>'+right+'</div>';
}

/* ---------- 14-day meal plan ---------- */
/* One card per day, three slots per card. Tapping a slot opens the same picker
   the single-day strip uses, so there's one place where a meal gets chosen and
   one set of rules about what's allowed in a slot.

   Slots always render in Breakfast/Lunch/Dinner order regardless of what came
   back from Notion, because SLOTS drives the loop rather than the row order. */
const SLOT_CLASS={Breakfast:"b",Lunch:"l",Dinner:"d"};

function renderMP(){
  const body=document.getElementById("mpBody");
  const sub=document.getElementById("mpSub");
  if(!mealsEnabled){
    sub.textContent="";
    body.innerHTML='<div class="empty">Meal planning is off. Set NOTION_MEALPLAN_DB in Vercel and redeploy to turn it on.</div>';
    return;
  }

  const last=addDays(mpStart,MP_DAYS-1);
  sub.textContent=shortDate(mpStart)+" – "+shortDate(last);

  let filled=0;
  let h='<div class="mpgrid">';
  for(let i=0;i<MP_DAYS;i++){
    const d=addDays(mpStart,i);
    const m=mealsOn(d);
    h+='<div class="mpday'+(d===TODAY?" today":"")+'">'+
       '<div class="mphead"><span class="mpdow">'+DOW[parse(d).getDay()]+'</span>'+
       '<span class="mpnum">'+MONS[parse(d).getMonth()]+" "+parse(d).getDate()+'</span></div>';
    SLOTS.forEach(slot=>{
      const set=!!(m[slot]&&m[slot].name);
      if(set)filled++;
      const isOpen=!!(mpOpen&&mpOpen.date===d&&mpOpen.slot===slot);
      h+='<div class="mpslot '+SLOT_CLASS[slot]+(isOpen?" open":"")+
         '" data-mpslot="'+d+'" data-mpsname="'+slot+'">'+
         '<div class="mpbar"></div><div class="mptext">'+
         '<span class="mpl">'+slot+'</span>'+
         '<span class="mpv'+(set?"":" none")+'">'+esc(set?m[slot].name:"—")+'</span>'+
         '</div>';
      if(isOpen)h+=mpPicker(d,slot,set?m[slot].name:null);
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';

  const total=MP_DAYS*3;
  h+='<div class="mpfoot">'+filled+' of '+total+' slots planned. '+
     'Changes save to the Meal Plan database straight away — edit here or in Notion, '+
     'whichever you touched last wins.</div>';
  body.innerHTML=h;
}

/* The picker, rendered inside a day card. Same contents as the single-day one:
   MP recipes matching the slot, the eating-out options, and a clear. */
function mpPicker(date,slot,cur){
  const opts=optionsFor(slot);
  let h='<div class="picker"><div class="picker-h">Cook</div>';
  if(!opts.length){
    h+='<div class="picker-note">No MP '+slot+' recipes loaded. Tag the recipe MP '+
       slot+' in Meals &amp; Recipes and it shows up here.</div>';
  }
  opts.forEach(o=>{
    h+='<div class="picker-i" data-mppick="'+esc(o.name)+'" data-mpdate="'+date+
       '" data-mpslotname="'+slot+'" data-mprid="'+esc(o.id||"")+'">'+
       '<span>'+esc(o.name)+'</span>'+
       (cur===o.name?'<span class="tick">✓</span>':'')+'</div>';
  });
  h+='<div class="picker-sep"></div><div class="picker-h">Eating out</div>';
  EATING_OUT.forEach(n=>{
    h+='<div class="picker-i" data-mppick="'+esc(n)+'" data-mpdate="'+date+
       '" data-mpslotname="'+slot+'" data-mprid="">'+
       '<span>'+esc(n)+'</span>'+
       (cur===n?'<span class="tick">✓</span>':'')+'</div>';
  });
  h+=otherRow(date,slot);
  if(cur){
    h+='<div class="picker-sep"></div>'+
       '<div class="picker-i picker-clear" data-mpclear="'+date+'" data-mpcslot="'+slot+'">Clear this slot</div>';
  }
  return h+'</div>';
}

/* ---------- actions (optimistic, reverted if the save fails) ---------- */
async function toggle(id){
  const t=TASKS.filter(x=>x.id===id)[0];
  if(!t)return;
  const was=t.done;
  t.done=!was;render();
  try{await push({action:"updateTask",id:id,done:t.done});}
  catch(e){t.done=was;render();toast("Didn't save: "+e.message);}
}

async function addTask(name,kind,date){
  name=(name||"").trim();
  if(!name)return false;
  const tmp="tmp"+(++_tmp);
  const row={id:tmp,name:name,kind:kind==="Errand"?"Errand":"Task",date:date||null,done:false};
  TASKS.push(row);render();
  try{
    const r=await push({action:"createTask",name:name,kind:row.kind,date:row.date});
    if(r&&r.task){row.id=r.task.id;render();}
  }catch(e){
    TASKS=TASKS.filter(x=>x.id!==tmp);render();
    toast("Didn't save: "+e.message);
  }
  return true;
}

async function moveTask(id,date){
  const t=TASKS.filter(x=>x.id===id)[0];
  if(!t)return;
  const was=t.date;
  t.date=date||null;render();
  try{await push({action:"updateTask",id:id,date:t.date});}
  catch(e){t.date=was;render();toast("Didn't save: "+e.message);}
}

/* Reads the Other box and saves it. Trimmed, because a stray space would
   otherwise create a Meal Plan row whose name is blank-looking but not empty,
   and those don't count as a planned day. */
function commitOther(date,slot){
  const f=document.getElementById("otherInput");
  const typed=f?f.value.trim():"";
  otherOpen=null;
  pickMeal(date,slot,typed||"Other",null);
}

/* Setting a meal. The date is passed in rather than read off `view`, because
   this is now driven from two places: the single-day strip, which always means
   today's view, and the 14-day grid, where every card is a different day. */
async function pickMeal(date,slot,name,recipeId){
  if(!date||!slot)return;
  const existing=MEALS.filter(m=>m.date===date&&m.slot===slot)[0];
  const rec=recipeId?[recipeId]:[];
  const was=existing?{name:existing.name,recipe:existing.recipe}:null;
  let row=existing;
  if(row){row.name=name;row.recipe=rec;}
  else{row={id:null,date:date,slot:slot,name:name,recipe:rec};MEALS.push(row);}
  openSlot=null;mpOpen=null;otherOpen=null;render();
  try{
    const r=await push({action:"setMeal",id:row.id,date:date,slot:slot,name:name,recipeId:recipeId||null});
    if(r&&r.meal)row.id=r.meal.id;
  }catch(e){
    if(!was&&!row.id)MEALS=MEALS.filter(m=>m!==row);
    else if(was){row.name=was.name;row.recipe=was.recipe;}
    render();toast("Didn't save: "+e.message);
  }
}

/* Clearing a slot.

   One request. The server archives the Meal Plan row, so it lands in Notion's
   trash rather than being destroyed, and a nameless row never gets left behind.

   Two things still get checked. A server can answer "fine" to a request it
   quietly ignored, so this re-reads Notion afterwards and says so if the meal is
   still sitting there — nothing claims to be cleared until Notion has been asked
   again. And if the meal can't be cleared, it goes straight back on screen,
   because a slot that looks empty here while it's still filled in Notion is
   worse than no button at all. */
async function clearMeal(date,slot){
  const row=MEALS.filter(m=>m.date===date&&m.slot===slot)[0];
  if(!row)return;
  openSlot=null;mpOpen=null;otherOpen=null;

  if(!row.id){
    MEALS=MEALS.filter(m=>m!==row);render();
    toast("That slot hadn't saved to Notion yet, so there was nothing to clear.");
    return;
  }

  const kept={name:row.name,recipe:row.recipe};
  MEALS=MEALS.filter(m=>m!==row);render();

  try{
    await push({action:"clearMeal",id:row.id});
  }catch(e){
    row.name=kept.name;row.recipe=kept.recipe;
    MEALS.push(row);render();
    let msg=/unknown action/i.test(e.message||"")
      ? "your api/notion.js is the old one, so deploy the updated server file and this works"
      : (e.message||"the server refused it");
    if(!/[.!?]$/.test(msg))msg+=".";
    toast("Couldn't clear "+slot.toLowerCase()+": "+msg+" It's still set in Notion, so nothing changed.");
    return;
  }

  try{
    absorb(await pull());
    render();
    const still=MEALS.filter(m=>m.date===row.date&&m.slot===slot&&m.name)[0];
    if(still){
      toast("The server said OK but "+slot.toLowerCase()+" is still \u201c"+still.name+
            "\u201d in Notion. Something's wrong on the server side.");
    }
  }catch(e){
    render();
    toast("Sent the clear, but couldn't re-check Notion: "+e.message);
  }
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  const t=e.target;
  if(t.id==="retry"){loadError=null;render();load();return;}

  const cb=t.closest?t.closest("[data-toggle]"):null;
  if(cb){toggle(cb.getAttribute("data-toggle"));return;}

  /* "Other" in the eating-out list. Opening it swaps the row for a text box;
     committing saves whatever was typed. An empty box saves the literal word
     "Other" rather than nothing, so the slot never ends up half-filled. */
  const ooOpen=t.closest?t.closest("[data-oopen]"):null;
  if(ooOpen){
    otherOpen={date:ooOpen.getAttribute("data-oodate"),slot:ooOpen.getAttribute("data-ooslot")};
    render();
    const f=document.getElementById("otherInput");
    if(f)f.focus();
    return;
  }
  const ooGo=t.closest?t.closest("[data-oogo]"):null;
  if(ooGo){commitOther(ooGo.getAttribute("data-oodate"),ooGo.getAttribute("data-ooslot"));return;}

  /* A click inside an open picker — on its padding, or on the text box — must
     never reach the slot toggles below, which would shut the picker mid-type. */
  if(t.closest&&t.closest(".picker"))return;

  /* The 14-day grid is checked first: its picks carry their own date, so they
     must not fall through to the single-day handlers, which assume `view`. */
  const mpPick=t.closest?t.closest("[data-mppick]"):null;
  if(mpPick){
    pickMeal(mpPick.getAttribute("data-mpdate"),
             mpPick.getAttribute("data-mpslotname"),
             mpPick.getAttribute("data-mppick"),
             mpPick.getAttribute("data-mprid")||null);
    return;
  }
  const mpClr=t.closest?t.closest("[data-mpclear]"):null;
  if(mpClr){
    clearMeal(mpClr.getAttribute("data-mpclear"),mpClr.getAttribute("data-mpcslot"));
    return;
  }
  const mpSlot=t.closest?t.closest("[data-mpslot]"):null;
  if(mpSlot){
    const d=mpSlot.getAttribute("data-mpslot"),s=mpSlot.getAttribute("data-mpsname");
    mpOpen=(mpOpen&&mpOpen.date===d&&mpOpen.slot===s)?null:{date:d,slot:s};
    renderMP();return;
  }
  if(mpOpen&&!document.getElementById("mpOvl").hidden){mpOpen=null;renderMP();}

  const pick=t.closest?t.closest("[data-pick]"):null;
  if(pick){pickMeal(view,openSlot,pick.getAttribute("data-pick"),pick.getAttribute("data-rid")||null);return;}

  const clr=t.closest?t.closest("[data-clear]"):null;
  if(clr){clearMeal(view,clr.getAttribute("data-clear"));return;}

  const slot=t.closest?t.closest(".slot"):null;
  if(slot){const s=slot.getAttribute("data-slot");openSlot=(openSlot===s)?null:s;render();return;}
  if(openSlot){openSlot=null;render();}

  if(t.id==="addOpen"){addOpen.day=true;render();const f=document.getElementById("addName");if(f)f.focus();return;}
  if(t.id==="addCancel"){addOpen.day=false;render();return;}
  if(t.id==="addGo"){
    const n=document.getElementById("addName").value;
    const k=document.getElementById("addKind").value;
    const d=document.getElementById("addDate").value;
    if(n.trim()){addOpen.day=false;addTask(n,k,d||null);}else render();
    return;
  }
  if(t.id==="ndOpen"){addOpen.nodate=true;render();const f=document.getElementById("ndName");if(f)f.focus();return;}
  if(t.id==="ndCancel"){addOpen.nodate=false;render();return;}
  if(t.id==="ndGo"){
    const n=document.getElementById("ndName").value;
    const k=document.getElementById("ndKind").value;
    if(n.trim()){addOpen.nodate=false;addTask(n,k,null);}else render();
    return;
  }

  const no=t.closest?t.closest("[data-newopen]"):null;
  if(no){addOpen["d"+no.getAttribute("data-newopen")]=true;renderTM();return;}
  const nc=t.closest?t.closest("[data-newcancel]"):null;
  if(nc){addOpen["d"+nc.getAttribute("data-newcancel")]=false;renderTM();return;}
  const ng=t.closest?t.closest("[data-newgo]"):null;
  if(ng){
    const d=ng.getAttribute("data-newgo");
    const n=document.querySelector('[data-newname="'+d+'"]').value;
    const k=document.querySelector('[data-newkind="'+d+'"]').value;
    const dt=document.querySelector('[data-newdate="'+d+'"]').value;
    if(n.trim()){addOpen["d"+d]=false;addTask(n,k,dt||null);}else renderTM();
    return;
  }
  if(t.id==="tmNdOpen"){addOpen.tmnodate=true;renderTM();return;}
  if(t.id==="tmNdCancel"){addOpen.tmnodate=false;renderTM();return;}
  if(t.id==="tmNdGo"){
    const n=document.getElementById("tmNdName").value;
    const k=document.getElementById("tmNdKind").value;
    if(n.trim()){addOpen.tmnodate=false;addTask(n,k,null);}else renderTM();
    return;
  }

  if(t.id==="prevDay"){view=addDays(view,-1);openSlot=null;addOpen.day=false;render();return;}
  if(t.id==="nextDay"){view=addDays(view,1);openSlot=null;addOpen.day=false;render();return;}
  if(t.id==="todayBtn"){TODAY=isoOf(new Date());view=TODAY;openSlot=null;render();load();return;}

  if(t.id==="openMP"){mpStart=view;mpOpen=null;document.getElementById("mpOvl").hidden=false;renderMP();return;}
  if(t.id==="closeMP"||t.id==="mpOvl"){document.getElementById("mpOvl").hidden=true;mpOpen=null;return;}
  if(t.id==="prevMP"){mpStart=addDays(mpStart,-MP_DAYS);mpOpen=null;renderMP();return;}
  if(t.id==="nextMP"){mpStart=addDays(mpStart,MP_DAYS);mpOpen=null;renderMP();return;}
  if(t.id==="mpToday"){mpStart=TODAY;mpOpen=null;renderMP();return;}

  if(t.id==="openTM"){wkStart=startOfWeek(view);document.getElementById("tmOvl").hidden=false;renderTM();return;}
  if(t.id==="closeTM"||t.id==="tmOvl"){document.getElementById("tmOvl").hidden=true;return;}
  if(t.id==="prevWk"){wkStart=addDays(wkStart,-7);renderTM();return;}
  if(t.id==="nextWk"){wkStart=addDays(wkStart,7);renderTM();return;}
});

document.addEventListener("change",function(e){
  const mv=e.target.getAttribute?e.target.getAttribute("data-move"):null;
  if(mv)moveTask(mv,e.target.value||null);
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(otherOpen){otherOpen=null;render();return;}
    if(!document.getElementById("mpOvl").hidden){
      if(mpOpen){mpOpen=null;renderMP();return;}
      document.getElementById("mpOvl").hidden=true;return;
    }
    if(!document.getElementById("tmOvl").hidden){document.getElementById("tmOvl").hidden=true;return;}
    if(openSlot){openSlot=null;render();}
  }
  if(e.key==="Enter"){
    const id=e.target.id||"";
    if(id==="otherInput"&&otherOpen){commitOther(otherOpen.date,otherOpen.slot);return;}
    if(id==="addName"){document.getElementById("addGo").click();return;}
    if(id==="ndName"){document.getElementById("ndGo").click();return;}
    if(id==="tmNdName"){document.getElementById("tmNdGo").click();return;}
    const nn=e.target.getAttribute?e.target.getAttribute("data-newname"):null;
    if(nn){document.querySelector('[data-newgo="'+nn+'"]').click();return;}
  }
  if((e.key===" "||e.key==="Enter")&&e.target.getAttribute&&e.target.getAttribute("data-toggle")){
    e.preventDefault();toggle(e.target.getAttribute("data-toggle"));
  }
});

/* Pick up edits made in Notion when you come back to the tab, and roll the day
   over if it's been open past midnight. */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&loaded&&busy===0){
    const now=isoOf(new Date());
    if(now!==TODAY&&view===TODAY)view=now;
    load();
  }
});

render();
load();
</script>
