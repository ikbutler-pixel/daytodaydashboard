<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isaiah's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-deep:#081a3d;
    --glass:rgba(30,64,130,0.42);
    --glass-2:rgba(15,35,80,0.55);
    --stroke:rgba(255,255,255,0.22);
    --text:#eaf2ff;
    --text-dim:#9fb9dc;
    --text-faint:#7f9bc4;
    --gold:#ffd89a;
    --c-class:#85b7eb;
    --c-event:#5dcaa5;
    --c-prod:#fac775;
    --c-due:#e24b4a;
    --c-none:#9fb9dc;
    --gap-green:#5dcaa5;
    --gap-yellow:#fac775;
    --gap-red:#e24b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,216,154,0.16), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(93,202,165,0.12), transparent 55%),
      linear-gradient(160deg,#0a2350 0%,#081a3d 55%,#050f28 100%);
    background-attachment:fixed;
    padding:22px 16px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  /* ---- glass shell ---- */
  .shell{
    background:linear-gradient(180deg,var(--glass),var(--glass-2));
    border:1px solid var(--stroke);
    border-radius:26px;
    padding:22px;
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 20px 60px rgba(4,12,32,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;letter-spacing:0.4px;line-height:1;}

  .btn{
    font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
    color:var(--gold);
    background:rgba(255,216,154,0.14);
    border:1px solid rgba(255,216,154,0.4);
    border-radius:12px;padding:9px 14px;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
    box-shadow:0 0 0 rgba(255,216,154,0);
  }
  .btn:hover{background:rgba(255,216,154,0.22);box-shadow:0 6px 22px rgba(255,216,154,0.25);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}

  .navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .stepper{display:flex;align-items:center;gap:14px;}
  .arrow{
    width:34px;height:34px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);
    color:var(--text);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .18s ease,transform .12s ease;
  }
  .arrow:hover{background:rgba(255,255,255,0.16);}
  .arrow:active{transform:scale(0.94);}
  .range{font-size:15px;color:#cfe0f7;min-width:150px;text-align:center;font-weight:500;}

  /* ---- filter panel ---- */
  .panel{
    background:rgba(8,22,52,0.85);border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;padding:14px 16px;margin-bottom:16px;
    display:none;
  }
  .panel.open{display:block;animation:drop .18s ease;}
  @keyframes drop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .panel-label{font-size:11px;letter-spacing:0.7px;text-transform:uppercase;color:var(--text-dim);}
  .toggle{display:flex;gap:6px;}
  .toggle button{
    font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;
    border-radius:9px;padding:5px 13px;color:var(--text-dim);
    background:transparent;border:1px solid rgba(255,255,255,0.15);transition:all .16s ease;
  }
  .toggle button.active{background:rgba(255,255,255,0.16);color:var(--text);border-color:rgba(255,255,255,0.3);}
  .chips{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;color:#e4eefc;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
    border-radius:22px;padding:5px 12px 5px 9px;user-select:none;transition:background .16s ease;
  }
  .chip:hover{background:rgba(255,255,255,0.11);}
  .chip input{width:14px;height:14px;margin:0;accent-color:var(--gold);cursor:pointer;}
  .chip .dot{width:9px;height:9px;border-radius:50%;}

  /* ---- legend ---- */
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:#cfe0f7;margin-bottom:14px;}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend .bar{width:20px;height:3px;border-radius:2px;}

  /* ---- calendar ---- */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:6px;}
  .dow div{font-size:10px;letter-spacing:0.5px;color:var(--text-faint);text-align:center;}
  .scroll{overflow-y:auto;max-height:none;}
  .scroll.month{max-height:420px;padding-right:4px;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:4px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cell{
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;padding:8px 6px;
  }
  .cell.week{min-height:230px;}
  .cell.month{min-height:104px;}
  .cell.blank{background:transparent;border:none;}
  .cell.today{border-color:rgba(255,216,154,0.55);box-shadow:0 0 0 1px rgba(255,216,154,0.35), 0 0 18px rgba(255,216,154,0.14);}
  .cell-num{font-size:11px;color:var(--text-dim);text-align:right;margin-bottom:5px;}
  .cell.today .cell-num{color:var(--gold);font-weight:700;}

  .evt{
    font-size:10px;line-height:1.2;border-radius:6px;padding:4px 6px;cursor:pointer;
    background:rgba(255,255,255,0.08);border-left:3px solid var(--c-none);
    margin-bottom:0;transition:background .14s ease;
  }
  .evt:hover{background:rgba(255,255,255,0.16);}
  .evt b{font-weight:600;color:#fff;display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evt em{color:#a9c2e2;font-size:8.5px;font-style:normal;}
  .gap{width:2px;margin:0 auto;border-radius:2px;}

  /* ---- today block ---- */
  .today-block{
    background:rgba(8,22,52,0.55);border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;padding:20px;margin-top:18px;
  }
  .greet{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;}
  .greet-sub{font-size:12.5px;color:var(--text-dim);margin:2px 0 16px;}
  .trow{display:flex;gap:14px;align-items:flex-start;margin-bottom:13px;cursor:pointer;}
  .trow:last-child{margin-bottom:0;}
  .tnum{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text-faint);min-width:24px;padding-top:1px;}
  .tbody{flex:1;border-left:3px solid var(--c-none);padding-left:12px;}
  .trow.past .tbody{opacity:0.45;}
  .trow.past .tmain{text-decoration:line-through;}
  .tmain{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .tmain .name{font-size:15px;}
  .tmain .time{font-size:12.5px;color:#a9c2e2;white-space:nowrap;}
  .tloc{font-size:11.5px;color:#89a4c8;margin-top:1px;}
  .empty{font-size:13.5px;color:var(--text-dim);font-style:italic;}

  /* ---- states ---- */
  .state{padding:38px 14px;text-align:center;color:var(--text-dim);font-size:14px;}
  .state.err{
    background:rgba(226,75,74,0.1);border:1px solid rgba(226,75,74,0.4);
    border-radius:14px;color:#ffd3d2;text-align:left;padding:16px 18px;font-size:13px;line-height:1.6;
  }
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,0.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:sp 0.8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ---- detail modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,12,30,0.72);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:22px;z-index:20;
  }
  .overlay.open{display:flex;animation:fade .16s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:linear-gradient(180deg,rgba(34,70,140,0.98),rgba(16,38,86,0.98));
    border:1px solid rgba(255,255,255,0.28);border-radius:20px;padding:22px;
    max-width:340px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,0.5);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.15;}
  .x{background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;padding:2px;}
  .x:hover{color:#fff;}
  .type-pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;margin:12px 0 16px;color:#0b1c30;}
  .drow{font-size:13.5px;line-height:1.9;color:#dbe6f7;display:flex;align-items:center;gap:8px;}
  .drow .ic{opacity:0.7;width:15px;text-align:center;}
  .gap-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dnote{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.16);color:#c4d6ee;font-size:13px;}

  @media (max-width:560px){
    .title{font-size:26px;}
    .cell.week{min-height:180px;}
    .range{min-width:110px;font-size:13.5px;}
    .evt b{font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="topbar">
      <div class="title" id="title">Isaiah's calendar</div>
      <button class="btn" id="filterBtn">&#9881; Filter &amp; view</button>
    </div>

    <div class="navrow">
      <div class="stepper">
        <button class="arrow" id="prev" aria-label="Previous">&#8249;</button>
        <div class="range" id="range">—</div>
        <button class="arrow" id="next" aria-label="Next">&#8250;</button>
      </div>
      <button class="btn" id="todayBtn" style="color:#cfe0f7;background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.18);">Today</button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-label">Show on calendar</span>
        <div class="toggle" id="toggle">
          <button data-view="week">Week</button>
          <button data-view="month">Month</button>
        </div>
      </div>
      <div class="chips" id="chips">
        <label class="chip"><input type="checkbox" checked data-type="Class"><span class="dot" style="background:var(--c-class)"></span>Class</label>
        <label class="chip"><input type="checkbox" checked data-type="Event"><span class="dot" style="background:var(--c-event)"></span>Event</label>
        <label class="chip"><input type="checkbox" checked data-type="Productivity"><span class="dot" style="background:var(--c-prod)"></span>Productivity</label>
        <label class="chip"><input type="checkbox" checked data-type="Due Date"><span class="dot" style="background:var(--c-due)"></span>Due Date</label>
      </div>
    </div>

    <div class="legend">
      <span><span class="bar" style="background:var(--gap-green)"></span>1.5&nbsp;hr+ between</span>
      <span><span class="bar" style="background:var(--gap-yellow)"></span>30&nbsp;min – 1.5&nbsp;hr</span>
      <span><span class="bar" style="background:var(--gap-red)"></span>≤ 30&nbsp;min — tight</span>
    </div>

    <div class="dow" id="dow"></div>
    <div class="scroll" id="scroll">
      <div class="grid" id="grid"></div>
    </div>

    <div class="today-block" id="todayBlock" style="display:none;">
      <div class="greet" id="greet">Hello</div>
      <div class="greet-sub" id="greetSub"></div>
      <div id="todayList"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="mTitle"></div>
      <button class="x" id="mClose" aria-label="Close">&times;</button>
    </div>
    <div id="mType"></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
const COLORS = {
  'Class':'#85b7eb','Event':'#5dcaa5','Productivity':'#fac775','Due Date':'#e24b4a'
};
const colorFor = t => COLORS[t] || '#9fb9dc';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

let ALL = [];          // all events from Notion
let view = 'week';     // 'week' | 'month'
let anchor = new Date(); // a date inside the shown period

// ---------- date helpers ----------
function parseStart(ev){
  if(!ev.start) return null;
  if(ev.hasTime) return new Date(ev.start);          // ISO w/ tz -> correct instant, shown local
  const [y,m,d] = ev.start.split('-').map(Number);   // all-day -> local midnight
  return new Date(y, m-1, d);
}
function parseEnd(ev){
  if(ev.end){ return ev.hasTime ? new Date(ev.end) : (()=>{const[y,m,d]=ev.end.split('-').map(Number);return new Date(y,m-1,d);})(); }
  // no end: timed events assumed 1 hour; all-day get no real end
  if(ev.hasTime){ const s=parseStart(ev); return s? new Date(s.getTime()+60*60000): null; }
  return null;
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function fmtTime(d){ return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function minutesBetween(a,b){ return Math.round((b-a)/60000); }
function gapColor(m){ return m>=90?'#5dcaa5':m>30?'#fac775':'#e24b4a'; }
function gapWord(m){ return m>=90?'comfortable':m>30?'a little tight':'back-to-back'; }

// ---------- filtering ----------
function activeTypes(){
  const a={}; document.querySelectorAll('#chips input').forEach(i=>a[i.dataset.type]=i.checked); return a;
}
function visibleOnDay(day){
  const on=activeTypes();
  return ALL
    .filter(ev=>{ const s=parseStart(ev); return s && sameDay(s,day); })
    .filter(ev=> ev.type ? on[ev.type] !== false : true) // untyped always shown
    .sort((a,b)=> parseStart(a)-parseStart(b));
}

// ---------- rendering ----------
function renderDow(){
  const el=document.getElementById('dow'); el.innerHTML='';
  DOW.forEach(d=>{ const c=document.createElement('div'); c.textContent=d; el.appendChild(c); });
}

function eventEl(ev, compact){
  const el=document.createElement('div'); el.className='evt';
  el.style.borderLeftColor=colorFor(ev.type);
  const s=parseStart(ev);
  const t = ev.hasTime ? fmtTime(s) : 'All day';
  el.innerHTML = '<b>'+escapeHtml(ev.name)+'</b>' + (compact? '' : '<em>'+t+'</em>');
  el.onclick=()=>openDetail(ev);
  return el;
}

function fillDay(container, day, compact){
  const evs=visibleOnDay(day);
  evs.forEach((ev,i)=>{
    if(i>0){
      const prevEnd=parseEnd(evs[i-1]); const curStart=parseStart(ev);
      if(prevEnd && curStart && ev.hasTime && evs[i-1].hasTime){
        const m=minutesBetween(prevEnd,curStart);
        if(m>=0){
          const line=document.createElement('div'); line.className='gap';
          const h = compact ? Math.max(6,Math.min(20,m*0.18)) : Math.max(10,Math.min(46,m*0.45));
          line.style.height=h+'px'; line.style.background=gapColor(m);
          line.title=m+' min gap'; container.appendChild(line);
        }
      }
    }
    container.appendChild(eventEl(ev, compact));
  });
}

function renderWeek(){
  view='week';
  document.getElementById('scroll').classList.remove('month');
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const mon=mondayOf(anchor);
  const today=new Date();
  for(let i=0;i<7;i++){
    const day=new Date(mon); day.setDate(mon.getDate()+i);
    const cell=document.createElement('div'); cell.className='cell week'+(sameDay(day,today)?' today':'');
    cell.innerHTML='<div class="cell-num">'+day.getDate()+'</div>';
    fillDay(cell, day, false);
    grid.appendChild(cell);
  }
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  document.getElementById('range').textContent = MONTHS_SH[mon.getMonth()]+' '+mon.getDate()+' – '+MONTHS_SH[sun.getMonth()]+' '+sun.getDate();
}

function renderMonth(){
  view='month';
  document.getElementById('scroll').classList.add('month');
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const y=anchor.getFullYear(), m=anchor.getMonth();
  const first=new Date(y,m,1);
  const lead=(first.getDay()+6)%7; // Monday-start offset
  const days=new Date(y,m+1,0).getDate();
  const today=new Date();
  for(let i=0;i<lead;i++){ const b=document.createElement('div'); b.className='cell blank'; grid.appendChild(b); }
  for(let d=1; d<=days; d++){
    const day=new Date(y,m,d);
    const cell=document.createElement('div'); cell.className='cell month'+(sameDay(day,today)?' today':'');
    cell.innerHTML='<div class="cell-num">'+d+'</div>';
    fillDay(cell, day, true);
    grid.appendChild(cell);
  }
  document.getElementById('range').textContent = MONTHS[m]+' '+y;
}

function render(){ view==='week'?renderWeek():renderMonth(); }

// ---------- today block ----------
function renderToday(){
  const list=document.getElementById('todayList'); list.innerHTML='';
  const now=new Date();
  const h=now.getHours();
  document.getElementById('greet').textContent = h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  document.getElementById('greetSub').textContent = "Here's the plan for today · "+now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  const evs = ALL.filter(ev=>{ const s=parseStart(ev); return s && sameDay(s,now); })
                 .sort((a,b)=> parseStart(a)-parseStart(b));
  if(evs.length===0){
    list.innerHTML='<div class="empty">Nothing on the calendar today — enjoy it.</div>';
    return;
  }
  evs.forEach((ev,i)=>{
    const s=parseStart(ev), e=parseEnd(ev);
    const past = ev.hasTime && e && e<now;
    const row=document.createElement('div'); row.className='trow'+(past?' past':'');
    const time = ev.hasTime ? fmtTime(s) : 'All day';
    row.innerHTML =
      '<div class="tnum">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="tbody" style="border-left-color:'+colorFor(ev.type)+'">'+
        '<div class="tmain"><span class="name">'+escapeHtml(ev.name)+'</span><span class="time">'+time+'</span></div>'+
        (ev.location?'<div class="tloc">'+escapeHtml(ev.location)+'</div>':'')+
      '</div>';
    row.onclick=()=>openDetail(ev);
    list.appendChild(row);
  });
}

// ---------- detail ----------
function openDetail(ev){
  document.getElementById('mTitle').textContent=ev.name;
  const pill=document.getElementById('mType');
  if(ev.type){ pill.innerHTML='<span class="type-pill" style="background:'+colorFor(ev.type)+'">'+ev.type+'</span>'; }
  else { pill.innerHTML='<span class="type-pill" style="background:#9fb9dc">No type</span>'; }

  const s=parseStart(ev), e=parseEnd(ev);
  let html='';
  html+='<div class="drow"><span class="ic">&#128197;</span>'+ s.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}) +'</div>';
  if(ev.hasTime){
    const dur = e? minutesBetween(s,e) : 60;
    const endTxt = ev.end ? fmtTime(new Date(ev.end)) : fmtTime(e)+' (assumed)';
    html+='<div class="drow"><span class="ic">&#128336;</span>'+fmtTime(s)+' – '+endTxt+' &nbsp;('+dur+' min)</div>';
  } else {
    html+='<div class="drow"><span class="ic">&#128336;</span>All day</div>';
  }
  if(ev.location) html+='<div class="drow"><span class="ic">&#128205;</span>'+escapeHtml(ev.location)+'</div>';
  if(ev.area) html+='<div class="drow"><span class="ic">&#127760;</span>'+ev.area+'</div>';

  // gap to neighbours the same day
  if(ev.hasTime){
    const sameDayEvs = ALL.filter(x=>{const xs=parseStart(x); return xs && sameDay(xs,s) && x.hasTime;})
                          .sort((a,b)=>parseStart(a)-parseStart(b));
    const idx=sameDayEvs.findIndex(x=>x.id===ev.id);
    if(idx>0){ const g=minutesBetween(parseEnd(sameDayEvs[idx-1]),s);
      html+='<div class="drow"><span class="gap-dot" style="background:'+gapColor(g)+'"></span>'+g+' min after '+escapeHtml(sameDayEvs[idx-1].name)+' ('+gapWord(g)+')</div>'; }
    if(idx>=0 && idx<sameDayEvs.length-1){ const g=minutesBetween(e,parseStart(sameDayEvs[idx+1]));
      html+='<div class="drow"><span class="gap-dot" style="background:'+gapColor(g)+'"></span>'+g+' min before '+escapeHtml(sameDayEvs[idx+1].name)+' ('+gapWord(g)+')</div>'; }
  }
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); }

// ---------- misc ----------
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- data load ----------
async function load(){
  const grid=document.getElementById('grid');
  grid.innerHTML='<div class="state" style="grid-column:1/-1"><div class="spin"></div>Reading your Notion calendar…</div>';
  try{
    const r=await fetch('/api/events');
    const data=await r.json();
    if(!r.ok){
      grid.innerHTML='<div class="state err" style="grid-column:1/-1"><b>Couldn\'t load your calendar.</b><br>'+escapeHtml(data.message||'Unknown error')+'</div>';
      return;
    }
    ALL=data.events||[];
    render();
    renderToday();
  }catch(e){
    grid.innerHTML='<div class="state err" style="grid-column:1/-1"><b>Couldn\'t reach the server.</b><br>'+escapeHtml(String(e))+'</div>';
  }
}

// ---------- wire up ----------
document.getElementById('filterBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');
document.querySelectorAll('#chips input').forEach(i=>i.onchange=render);
document.getElementById('toggle').querySelectorAll('button').forEach(b=>{
  if(b.dataset.view==='week') b.classList.add('active');
  b.onclick=()=>{
    document.querySelectorAll('#toggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    b.dataset.view==='week'?renderWeek():renderMonth();
  };
});
document.getElementById('prev').onclick=()=>{
  if(view==='week') anchor.setDate(anchor.getDate()-7);
  else anchor.setMonth(anchor.getMonth()-1);
  render();
};
document.getElementById('next').onclick=()=>{
  if(view==='week') anchor.setDate(anchor.getDate()+7);
  else anchor.setMonth(anchor.getMonth()+1);
  render();
};
document.getElementById('todayBtn').onclick=()=>{
  const block=document.getElementById('todayBlock');
  const showing = block.style.display!=='none';
  block.style.display = showing ? 'none' : 'block';
  document.getElementById('todayBtn').textContent = 'Today';
  if(!showing) block.scrollIntoView({behavior:'smooth',block:'end'});
};
document.getElementById('mClose').onclick=closeDetail;
document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay') closeDetail(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });

renderDow();
load();
</script>
